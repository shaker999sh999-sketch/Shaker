<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070A14">
<title>تم — خدمات المنزل</title>
<style>
:root{--brown:#4A2C1D;--brown2:#6B4330;--amber:#D9A441;--bg:#EDEFEC;--card:#fff;--ink:#241A15;--mute:#7B6F68;--line:#E2DFDA;--green:#1E9E57;--red:#C62828;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Readex Pro',Tahoma,Arial,sans-serif;background:#070A14;color:var(--ink);line-height:1.65;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brown2)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:14px;padding-right:14px}
small{font-size:.8em;color:var(--mute)}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.05rem;font-weight:600;margin-bottom:8px}
h2.sec{margin:20px 2px 8px;color:#E8E4DE}

/* ===== الخلفية الفضائية المتحركة ===== */
#space{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(1200px 800px at 70% -10%,#16223F 0%,#0A1024 45%,#070A14 100%)}
.stars,.stars2{position:absolute;top:0;right:0;bottom:0;left:0;background-repeat:repeat}
.stars{background-image:radial-gradient(1.6px 1.6px at 22px 34px,#fff 55%,transparent 60%),radial-gradient(1.2px 1.2px at 78px 92px,#CFE3FF 55%,transparent 60%),radial-gradient(1px 1px at 140px 44px,#fff 55%,transparent 60%),radial-gradient(1.4px 1.4px at 190px 140px,#FFE9C4 55%,transparent 60%);background-size:230px 230px;animation:tw 3.4s ease-in-out infinite alternate}
.stars2{background-image:radial-gradient(1px 1px at 40px 120px,#fff 55%,transparent 60%),radial-gradient(1.8px 1.8px at 160px 70px,#BFD7FF 55%,transparent 60%),radial-gradient(1.1px 1.1px at 210px 180px,#fff 55%,transparent 60%);background-size:270px 270px;animation:tw 4.6s .8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:.95}}
.earth{position:absolute;bottom:-43vh;left:50%;width:130vmin;height:130vmin;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 34% 26%,#3E7CB1 0%,#2A5C8F 24%,#1B3A63 46%,#0D1E3D 66%,#060B18 100%);box-shadow:0 -30px 90px rgba(70,140,220,.35),inset 0 26px 70px rgba(140,200,255,.28),inset 0 -60px 120px rgba(0,0,0,.85)}
.meteor{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFE9C4;box-shadow:0 0 8px 2px rgba(255,190,110,.9);opacity:0;animation:fall 7s linear infinite}
.meteor::after{content:'';position:absolute;bottom:0;right:0;width:150px;height:2px;border-radius:2px;background:linear-gradient(to left,rgba(255,200,130,.95),rgba(255,140,60,.35) 55%,transparent);transform-origin:right center}
.m1{top:-6%;left:12%;animation-delay:.4s}
.m2{top:-10%;left:48%;animation-delay:2.9s;animation-duration:8.5s}
.m3{top:-4%;left:74%;animation-delay:5.3s;animation-duration:6.4s}
.m4{top:-12%;left:28%;animation-delay:7.6s;animation-duration:9.2s}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(215deg);opacity:0}3%{opacity:1}16%{transform:translate3d(-48vw,46vh,0) rotate(215deg);opacity:1}20%,100%{transform:translate3d(-60vw,58vh,0) rotate(215deg);opacity:0}}

/* ===== الشاشة الترحيبية ===== */
#splash{position:fixed;top:0;right:0;bottom:0;left:0;background:#04060D;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:100%;height:100%;object-fit:cover}
.sp-fallback{display:none;color:#F3E3CF;font-size:4rem;font-weight:700}

/* header */
.stick{position:-webkit-sticky;position:sticky;top:0;z-index:20;background:rgba(8,11,22,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.bar{display:flex;align-items:center;justify-content:space-between;padding-top:8px;padding-bottom:8px;padding-top:calc(8px + env(safe-area-inset-top))}
.logo-b{color:#fff;font-size:1.7rem;font-weight:700;line-height:1;padding:2px 6px;-webkit-tap-highlight-color:transparent;user-select:none}
.who{display:flex;align-items:center;color:#CBD4E6;font-size:.9rem}
.lnk{color:var(--amber);font-size:.85rem;text-decoration:underline;padding:4px}
.ticker{direction:ltr;overflow:hidden;color:#fff;font-weight:500;font-size:.92rem;padding:5px 0;white-space:nowrap}
.ticker span{display:inline-block;direction:rtl;padding-left:100%;animation:tk 25s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
nav{display:flex;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none;max-width:640px;margin:0 auto;padding-left:14px;padding-right:14px}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 16px;border-radius:999px;color:#CBD4E6;font-size:.92rem;position:relative;border:1px solid rgba(255,255,255,.18)}
.tab.on{background:var(--amber);color:#241A15;border-color:var(--amber);font-weight:600}
.dot{position:absolute;top:-5px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-size:.7rem;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.btn .dot{position:static;margin-right:6px}

/* اللوحة الترويجية المتحركة */
.promo{margin:2px 0 0;padding:9px 12px;text-align:center;color:#fff;font-weight:700;font-size:.95rem;background:linear-gradient(270deg,#7b2ff7,#f107a3,#ff8a00,#1E9E57,#1D4C8F,#7b2ff7);background-size:600% 600%;animation:promoMove 10s ease infinite;text-shadow:0 1px 3px rgba(0,0,0,.45)}
@keyframes promoMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* content */
main{position:relative;z-index:1;padding-top:14px;padding-bottom:40px}
.card{background:rgba(255,255,255,.97);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 28px rgba(3,6,16,.35)}
.form{display:flex;flex-direction:column}
label{display:flex;flex-direction:column;font-size:.9rem;font-weight:500}
input,textarea,select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#FBFBFA;width:100%}
textarea{resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--brown2);outline:0;background:#fff}
fieldset{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
legend{font-size:.85rem;padding-left:6px;padding-right:6px;font-weight:500}
.chk{flex-direction:row;align-items:center;padding:4px 0}
.chk input{width:auto}
.file input{padding:8px;background:#fff}
.file.ok input{border-color:var(--green)}
.btn{background:var(--brown);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.green{background:var(--green)}
.loc{display:flex;align-items:center;flex-wrap:wrap}
.mute{color:var(--mute);font-size:.88rem}
.empty{color:#B9C0CE;text-align:center;padding:22px 10px;font-size:.92rem}
.card .empty{color:var(--mute);padding:8px 0}
.thumbs{display:flex;flex-wrap:wrap;margin:8px 0}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.hello{margin:6px 2px 14px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.hello p{color:#C7CEDD}
.tiles{display:flex;margin-bottom:6px}
.tile{flex:1;margin-left:10px;background:rgba(10,16,36,.78);color:#fff;border:1px solid rgba(122,162,255,.25);border-radius:var(--r);padding:16px 10px;text-align:center;display:flex;flex-direction:column;min-height:96px;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tile b{font-size:1.02rem}
.tile small{color:#AFC3EA;font-size:.74rem}

/* requests */
.req .top{display:flex;align-items:center;margin-bottom:6px}
.req .top time{margin-right:auto;color:var(--mute);font-size:.8rem}
.chip{font-size:.76rem;padding:2px 10px;border-radius:99px;background:#EEE8E2;color:var(--brown);font-weight:500}
.s-open{background:#FFF1D2;color:#7A5300}
.s-accepted{background:#DDF3E5;color:#146B3A}
.s-done_pending{background:#E3ECFA;color:#1D4C8F}
.s-done{background:#E6E6E6;color:#444}
.s-cancelled{background:#F8DEDE;color:#8E1B1B}
.s-suspended{background:#F8DEDE;color:#8E1B1B}
.desc{white-space:pre-wrap;word-break:break-word}
.wait{color:var(--mute);font-size:.9rem;padding:10px 0 2px}
.offers{display:flex;flex-direction:column;margin-top:10px}
.offer{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.o-main{display:flex;flex-direction:column}
.o-side{display:flex;flex-direction:column;align-items:flex-end}
.o-side strong,.deal strong{color:var(--brown);font-size:1.05rem}
.dur{display:inline-block;background:#E3ECFA;color:#1D4C8F;border-radius:99px;padding:1px 9px;font-size:.74rem;margin-top:3px;width:fit-content}
.stars{color:#B8860B;font-size:.85rem;margin-right:6px}
.deal{display:flex;justify-content:space-between;align-items:center;background:#F6F3EF;border-radius:12px;padding:10px 12px;margin-top:10px}
.phone{font-weight:600;direction:ltr;display:inline-block}
.acts{display:flex;flex-wrap:wrap;margin-top:12px;align-items:center}
.loc-l{margin-top:6px}

/* بطاقة مساعد الفني الذكي */
.ai-tip{display:flex;flex-direction:column;background:linear-gradient(135deg,#FFF6E0,#FDEBD2);border:1.5px solid #EBC97E;border-radius:12px;padding:10px 12px;margin-top:10px}
.ai-tip b{color:#7A5300;font-size:.92rem}
.ai-tip p{font-size:.86rem;color:#6B5320}

/* technician */
.online{display:flex;justify-content:space-between;align-items:center}
.online.on{border-color:var(--green);background:#F1FBF5}
.switch{width:58px;height:32px;border-radius:99px;background:#C9C3BD;position:relative;transition:background .2s;flex:0 0 auto}
.switch i{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--green)}
.switch.on i{right:29px}

/* واجهة تقديم العرض */
.sld-wrap{margin-top:14px;background:#F6F3EF;border:1.5px solid var(--line);border-radius:14px;padding:14px}
.sld-top{display:flex;justify-content:space-between;align-items:baseline}
.sld-val{font-size:1.7rem;font-weight:700;color:var(--brown);direction:ltr}
.sld-val small{font-size:.75rem;color:var(--mute);font-weight:500}
.sld-limits{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute);margin-top:2px;direction:ltr}
input[type=range].price-slider{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;direction:ltr;margin-top:8px;cursor:pointer}
input[type=range].price-slider::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(to right,#4A2C1D 0%,#D9A441 55%,#E6E1DB 55%,#E6E1DB 100%)}
input[type=range].price-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid var(--brown);box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range].price-slider::-moz-range-track{height:10px;border-radius:99px;background:#E6E1DB}
input[type=range].price-slider::-moz-range-progress{height:10px;border-radius:99px;background:linear-gradient(to right,#4A2C1D,#D9A441)}
input[type=range].price-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--brown);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.dur-grid{display:flex;flex-wrap:wrap;margin-top:4px}
.dur-chip{border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-size:.88rem;font-weight:600;background:#fff;flex:1;text-align:center}
.dur-chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.ai-hint{margin-top:10px;font-size:.84rem;background:#E3ECFA;color:#1D4C8F;border-radius:10px;padding:7px 10px}

/* admin */
.subtabs{display:flex;margin-bottom:12px}
.stab{flex:1;padding:9px 6px;border-radius:10px;background:rgba(255,255,255,.16);color:#E8E4DE;font-weight:500;position:relative;font-size:.92rem;border:1px solid rgba(255,255,255,.14)}
.stab.on{background:var(--amber);color:#241A15;border-color:var(--amber)}
.sw{display:flex;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
input[type=color]{width:52px;height:38px;padding:2px}
.row{display:flex;justify-content:space-between;align-items:flex-start}
.flag{background:#F8DEDE;color:#8E1B1B}

/* modal, chat */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(4,6,13,.72);display:flex;align-items:flex-end;justify-content:center;z-index:60}
#modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px;max-height:90vh;overflow:auto;animation:rise .25s ease;padding-bottom:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;margin-bottom:10px}
.x{margin-right:auto;font-size:1.6rem;line-height:1;color:var(--mute);padding:0 6px}
.sheet img.big{width:100%;border-radius:12px}
.chat{display:flex;flex-direction:column;height:82vh}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;padding:6px 2px}
.b{max-width:80%;padding:8px 12px;border-radius:14px;word-break:break-word;font-size:.95rem}
.b time{display:block;font-size:.68rem;opacity:.65;margin-top:2px}
.b.me{align-self:flex-start;background:var(--brown);color:#fff;border-bottom-right-radius:4px}
.b.them{align-self:flex-end;background:#EFEBE6;border-bottom-left-radius:4px}
.msgf{display:flex;margin-top:8px}
.safe{font-size:.76rem;color:var(--mute);background:#FFF6E0;border-radius:8px;padding:5px 10px;margin-bottom:6px}
.rate{display:flex;justify-content:center;margin:14px 0}
.rate button{font-size:2.3rem;color:#D8D2CB;transition:color .15s,transform .15s}
.rate button.on{color:#E0A400;transform:scale(1.1)}
#toasts{position:fixed;bottom:16px;bottom:calc(16px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;flex-direction:column;align-items:center;z-index:200;pointer-events:none}
.toast{background:#101A33;color:#fff;padding:10px 16px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:rise .25s;max-width:480px;border:1px solid rgba(140,170,255,.25)}
.toast.err{background:var(--red)}

/* auth */
.auth{position:relative;z-index:1;padding-top:40px;padding-top:calc(40px + env(safe-area-inset-top))}
.brand{text-align:center;margin-bottom:22px}
.brand span{display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;background:#101A33;color:#F3E3CF;font-size:2.6rem;font-weight:700;border:3px solid var(--amber);box-shadow:0 0 34px rgba(122,162,255,.35)}
.brand p{margin-top:10px;color:#C7CEDD;text-shadow:0 1px 6px rgba(0,0,0,.5)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}
  .ticker span{animation:none;padding-left:0}
}

.tile:last-child{margin-left:0}
.who>*+*,nav>*+*,.chk>*+*,.loc>*+*,.req .top>*+*,.offer>*+*,.deal>*+*,.online>*+*,.subtabs>*+*,.row>*+*,.sh-h>*+*,.msgf>*+*,.rate>*+*,.dur-grid>*+*{margin-right:8px}
.thumbs>*,.acts>*,.sw>*{margin:0 0 8px 8px}
.form>*+*,.offers>*+*,.o-side>*+*,.msgs>*+*{margin-top:10px}
label>*+*{margin-top:4px}
#toasts>*+*{margin-top:8px}
.tab{margin-left:0}
:root{--css-ok:1}

/* أيقونات الأقسام */
.ti{display:inline-block;vertical-align:middle;flex:0 0 auto;margin-left:6px}
.ti svg{display:block;width:100%;height:100%}
h2 .ti{vertical-align:-8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:10px;gap:10px}
.tiles>.tile,.tiles>.tile:last-child{margin:0;padding:12px 6px;min-height:118px}
.tile .ic{display:block;width:52px;height:52px;margin:0 auto 6px;padding:7px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.tile .ic svg{display:block;width:100%;height:100%}
.tile b{font-size:.95rem}
/* الخلفية: صورة بابل */
#space{background-color:#070A14;background-position:center top;background-size:cover;background-repeat:no-repeat}
#space::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(to bottom,rgba(4,7,16,.35) 0%,rgba(4,7,16,.62) 45%,rgba(4,7,16,.82) 100%)}

/* ===== الواجهة الجديدة: ثيم أبيض + خلفية صورة اختيارية ===== */
body{background:#EFEBE5}
#space{background:#EFEBE5 center top/cover no-repeat}
#space::after{display:none}
body.photo #space::after{display:block;background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.42))}
.stick{background:rgba(255,255,255,.96)}
.bar{padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:10px}
.logo-b{color:var(--brown);font-size:2rem}
.hr{display:flex;align-items:center}.hr>*+*{margin-right:8px}
.tg{width:38px;height:38px;border-radius:50%;background:#EFE9E1;font-size:1.1rem}
.locb{background:var(--brown);color:#fff;border-radius:10px;padding:7px 12px;font-size:.85rem}
.hello,h2.sec{color:var(--ink);text-shadow:none}.hello h1{font-size:1.6rem}
.empty{color:var(--mute)}.brand p{color:var(--mute)}
body.photo .hello,body.photo h2.sec,body.photo .back{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
body.photo .empty,body.photo .brand p{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.card .empty{color:var(--mute);text-shadow:none}
.ti,.tile .ic,.pop .ti{color:var(--brown)}
.ti svg,.tile .ic svg{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.search{border-radius:12px;background:#fff;margin-bottom:12px}
.tiles>.tile,.tiles>.tile:last-child{background:#E9E3DA;color:var(--ink);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;min-height:92px;padding:14px 6px}
.tile .ic{width:40px;height:40px;margin:0 auto 6px;padding:0;background:none;border:0}
.tile b{font-size:.9rem;color:var(--ink)}
.pops{display:flex;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.pops::-webkit-scrollbar{display:none}
.pop{flex:0 0 160px;margin-left:10px;background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.pop>*+*{margin-top:6px}.pop small{color:var(--mute)}.pop .btn{margin-top:auto}
.back{display:inline-block;margin-bottom:8px;color:var(--brown);font-weight:600;text-decoration:none}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;max-width:none;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.1);overflow:visible}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:.72rem;color:var(--mute);padding:2px 0}
.bi svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
.bi.on{color:var(--brown);font-weight:600}.bi .dot{top:-3px;right:26%}
main{padding-bottom:96px}#toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
.chat-row{display:flex;align-items:center;width:100%;text-align:right}.chat-row>*+*{margin-right:10px}
.chat-row .cm{flex:1;min-width:0;display:flex;flex-direction:column}
.chat-row .cm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    }
    W.CLOUD = true; W.CLOUDERR = '';
    try { W.LS.setItem(W.DB_KEY, JSON.stringify(d)); } catch (e) { }
    var m = W.me();
    if (!m) { W.SS.removeItem(W.SES); if (!document.querySelector('.auth')) W.renderAuth(); }
    else if (!document.getElementById('view')) { W.known = {}; W.notifyScan(true); W.renderApp(); }
    else { W.notifyScan(first); W.refresh(); }
    first = false;
}
try {
    fs = getFirestore(initializeApp(cfg));
    COLS.forEach(function (c) { shadow[c] = {}; onSnapshot(collection(fs, c), function (s) { if (!ready && s.metadata.fromCache) return; got[c] = s.docs.map(function (x) { return x.data(); }); apply(); }, fail); });
    var _s = W.save; W.save = function () { var ok = _s(); if (ok && ready) push(); return ok; };
} catch (e) { fail(e); }
setTimeout(function () { if (!ready) fail({ code: 'unavailable' }); }, 12000);
</script>
